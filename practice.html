<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DivePractice — Dive Drills</title>
<link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
<style>
/* =============================================
   Design tokens — matched to Dive Drills (divedrills.com)
   ============================================= */
:root{
  --bg-primary:#0f0f0f;
  --bg-surface:#1a1a1a;
  --bg-surface-2:#242424;
  --border:#2e2e2e;
  --text-primary:#f0f0f0;
  --text-secondary:#a0a0a0;
  --accent:#00c9a7;
  --accent-hover:#00b596;
  --accent-dim:rgba(0,201,167,.12);
  --pending:#f5a623;
  --pending-dim:rgba(245,166,35,.12);
  --danger:#e05252;
  --danger-dim:rgba(224,82,82,.12);
  --nav-width:240px;
  --nav-bottom-height:62px;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:16px;
  --shadow-card:0 2px 16px rgba(0,0,0,.45);
  --transition:all .18s ease;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font);
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.5;
  min-height:100vh;
  font-size:14px;
}
h1,h2,h3{font-family:var(--font);font-weight:700;margin:0;color:var(--text-primary);}
a{color:var(--accent);text-decoration:none;cursor:pointer;}
a:hover{text-decoration:underline;}
button{font-family:inherit;cursor:pointer;}
#app{display:flex;min-height:100vh;}

/* SIDEBAR */
#sidebar{
  display:none;
  position:fixed;top:0;left:0;
  width:var(--nav-width);height:100vh;
  background:var(--bg-surface);
  border-right:1px solid var(--border);
  flex-direction:column;
  z-index:100;overflow-y:auto;
  color:var(--text-secondary);
}
@media(min-width:768px){#sidebar{display:flex;}}
.pp-back-link{display:flex;align-items:center;gap:8px;padding:14px 20px;color:var(--text-secondary);font-size:.8rem;font-weight:600;text-decoration:none;border-bottom:1px solid var(--border);transition:var(--transition);flex-shrink:0;}
.pp-back-link:hover{color:var(--accent);background:var(--bg-surface-2);text-decoration:none;}
.pp-mobile-backbar{display:flex;padding:10px 20px;background:var(--bg-surface);border-bottom:1px solid var(--border);}
.pp-mobile-backbar a{display:flex;align-items:center;gap:6px;color:var(--text-secondary);font-size:.8rem;font-weight:600;}
.pp-mobile-backbar a:hover{color:var(--accent);}
@media(min-width:768px){.pp-mobile-backbar{display:none;}}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 16px;border-bottom:1px solid var(--border);cursor:pointer;}
.brand:hover{opacity:.8;}
.brand-mark{width:1.7rem;height:1.7rem;flex-shrink:0;object-fit:contain;}
.brand-text{font-size:1.2rem;font-weight:800;color:var(--text-primary);letter-spacing:-.3px;}
.brand-text span{color:var(--accent);}
.brand-tagline{font-size:.62rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}

.sidebar-nav{flex:1;padding:8px 0;display:flex;flex-direction:column;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 20px;
  color:var(--text-secondary);font-size:.875rem;font-weight:500;
  cursor:pointer;border:none;background:none;width:100%;text-align:left;
  text-decoration:none;position:relative;transition:var(--transition);white-space:nowrap;
}
.nav-item:hover{color:var(--text-primary);background:var(--bg-surface-2);text-decoration:none;}
.nav-item.active{color:var(--accent);background:var(--accent-dim);}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:0 2px 2px 0;}
.nav-item .nav-icon{font-size:1.05rem;width:20px;text-align:center;flex-shrink:0;}
.nav-item .chev{margin-left:auto;color:var(--text-secondary);font-size:.7rem;}
.submenu{background:rgba(0,0,0,.18);}
.submenu .nav-item{padding-left:48px;font-size:.82rem;}
.addbtn{
  display:flex;align-items:center;gap:11px;padding:13px 20px;color:var(--text-primary);
  cursor:pointer;font-weight:700;border-bottom:1px solid var(--border);transition:var(--transition);
}
.addbtn:hover{background:var(--bg-surface-2);}
.addbtn .nav-icon{color:var(--accent);font-size:1.1rem;}
.sidebar-footer{padding:16px 20px;border-top:1px solid var(--border);flex-shrink:0;}
.user-info-nav{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.avatar-sm{width:34px;height:34px;border-radius:50%;background:var(--bg-surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--accent);flex-shrink:0;}
.user-name-nav{font-size:.85rem;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-role-nav{font-size:.68rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* BOTTOM NAV (mobile) */
.bottom-nav{
  display:flex;position:fixed;bottom:0;left:0;right:0;height:var(--nav-bottom-height);
  background:var(--bg-surface);border-top:1px solid var(--border);z-index:100;padding:0 4px;
}
@media(min-width:768px){.bottom-nav{display:none;}}
.bottom-nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--text-secondary);font-size:.6rem;font-weight:500;cursor:pointer;transition:var(--transition);
  border:none;background:none;padding:8px 2px;
}
.bottom-nav-item:hover,.bottom-nav-item.active{color:var(--accent);}
.bottom-nav-item .nav-icon{font-size:1.25rem;line-height:1;}

/* MAIN */
#mainWrap{flex:1;min-width:0;display:flex;flex-direction:column;}
@media(min-width:768px){#mainWrap{margin-left:var(--nav-width);}}
#content{padding:24px 20px calc(var(--nav-bottom-height) + 28px);max-width:1500px;width:100%;margin:0 auto;}
@media(min-width:768px){#content{padding:36px 40px;}}
.pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.pagehead h1{font-size:1.6rem;color:var(--text-primary);}
.crumb{color:var(--text-secondary);font-size:.8rem;margin-bottom:8px;}
.crumb a{color:var(--text-secondary);}
.crumb a:hover{color:var(--accent);}

/* STATUS BANNER (offline indicator) */
#statusBanner{padding:0 20px;}
@media(min-width:768px){#statusBanner{padding:0 40px;}}
.status-alert{
  margin-top:20px;padding:12px 16px;border-radius:var(--radius-sm);font-size:.85rem;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--pending-dim);border:1px solid rgba(245,166,35,.3);color:var(--pending);
}
.status-alert .msg{flex:1;min-width:200px;}
.status-alert strong{color:var(--pending);}

/* SYNC DOT */
.sync-dot-wrap{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:.72rem;color:var(--text-secondary);}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#6b7280;transition:background .2s ease;}
.sync-dot.idle{background:var(--accent);}
.sync-dot.saving{background:#f5a623;animation:sync-pulse 1s ease-in-out infinite;}
.sync-dot.error{background:#eb5757;}
@keyframes sync-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* DEBUG BAR — only shown when the page URL has ?debug=1 */
.debug-bar{
  display:flex;flex-direction:column;gap:4px;padding:8px 16px;font-size:.72rem;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:#1a0f00;border-bottom:2px solid #f5a623;color:#f5a623;
}
.debug-bar-row{display:flex;flex-wrap:wrap;gap:6px 16px;}
.debug-bar strong{color:#fff;}

/* MINUTES INPUT PAIR */
.min-input-pair{display:flex;gap:4px;align-items:center;}
.min-input-pair .min-num{width:52px;padding:6px 4px;}
.min-input-pair .min-txt{width:48px;padding:6px 4px;text-align:center;}

/* INITIAL LOAD SPINNER (duplicated from the shared site stylesheet — this page is self-contained) */
.pp-loading-spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:pp-spin .65s linear infinite;flex-shrink:0;}
.pp-loading-spinner-lg{width:38px;height:38px;border-width:3px;}
@keyframes pp-spin{to{transform:rotate(360deg);}}
.pp-loading-overlay{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:14px;color:var(--text-secondary);font-size:.85rem;}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;
  border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;border:1px solid var(--border);
  cursor:pointer;transition:var(--transition);white-space:nowrap;line-height:1.2;
  background:var(--bg-surface-2);color:var(--text-primary);
}
.btn:hover{background:var(--border);}
.btn-primary{background:var(--accent);color:#000;border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-hover);color:#000;}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg-surface-2);color:var(--text-primary);}
.btn-danger{background:var(--danger);color:#fff;border-color:var(--danger);}
.btn-danger:hover{background:#c94040;}
.btn-sm{padding:6px 14px;font-size:.78rem;}
.btn-group{display:flex;gap:10px;flex-wrap:wrap;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}

/* FORMS */
.input,select.input,textarea.input{
  border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 13px;font-size:.9rem;
  background:var(--bg-surface-2);color:var(--text-primary);font-family:inherit;outline:none;transition:var(--transition);
}
.input::placeholder{color:var(--text-secondary);opacity:.6;}
.input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.search-wrap{position:relative;}
.search-wrap .s-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-secondary);font-size:.85rem;pointer-events:none;}
.search-wrap input{padding-left:32px;min-width:220px;}

/* TABLE */
table{width:100%;border-collapse:collapse;}
.tablewrap{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);background:var(--bg-surface);}
thead tr{background:var(--bg-surface-2);}
th{color:var(--text-secondary);text-align:left;padding:11px 14px;font-size:.7rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:.85rem;vertical-align:middle;color:var(--text-primary);}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg-surface-2);}
.empty-row td{text-align:center;color:var(--text-secondary);padding:34px;background:var(--bg-surface);}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.badge-accent{background:var(--accent-dim);color:var(--accent);}
.badge-secondary{background:var(--bg-surface-2);color:var(--text-secondary);border:1px solid var(--border);}
.badge-pending{background:var(--pending-dim);color:var(--pending);}

.icon-btn{background:none;border:none;color:var(--text-secondary);padding:5px;border-radius:6px;display:inline-flex;font-size:.95rem;transition:var(--transition);}
.icon-btn:hover{color:var(--accent);}
.row-actions{display:flex;gap:2px;justify-content:flex-end;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:16px;padding:3px 10px;font-size:.75rem;margin:2px 4px 2px 0;color:var(--text-primary);}
.chip button{background:none;border:none;color:var(--text-secondary);padding:0;display:flex;font-size:.75rem;}
.chip button:hover{color:var(--danger);}
.link-add{font-size:.78rem;font-weight:600;color:var(--accent);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;cursor:pointer;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;z-index:1000;padding:6vh 16px;overflow:auto;}
.modal{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal.wide{max-width:900px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);}
.modal-head h3{font-size:1.1rem;}
.modal-body{padding:20px 22px;max-height:70vh;overflow:auto;}
.modal-foot{padding:16px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.82rem;font-weight:500;color:var(--text-secondary);margin-bottom:6px;}
.field .input,.field select,.field textarea{width:100%;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}

/* TOGGLE */
.toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .slider{position:absolute;inset:0;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:999px;transition:var(--transition);cursor:pointer;}
.toggle .slider:before{content:"";position:absolute;height:18px;width:18px;left:2px;bottom:2px;background:var(--text-secondary);border-radius:50%;transition:var(--transition);}
.toggle input:checked+.slider{background:var(--accent-dim);border-color:var(--accent);}
.toggle input:checked+.slider:before{transform:translateX(20px);background:var(--accent);}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.toggle-row:last-child{border-bottom:none;}

/* CARDS */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;box-shadow:var(--shadow-card);}
.grid-dash{display:grid;grid-template-columns:2.2fr 1fr;gap:20px;align-items:start;}
@media(max-width:1000px){.grid-dash{grid-template-columns:1fr;}.field-row{grid-template-columns:1fr;}}

.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;}
.qa-col h4{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--text-secondary);margin:0 0 10px;font-weight:700;}
.qa-item{display:flex;align-items:center;gap:9px;padding:8px 0;font-size:.88rem;color:var(--text-primary);cursor:pointer;}
.qa-item:hover{color:var(--accent);}
@media(max-width:760px){.qa-grid{grid-template-columns:1fr 1fr;}}

/* CALENDAR */
.mini-cal-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.upcoming-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center;}
.upcoming-item:last-child{border-bottom:none;}
.date-pill{width:44px;text-align:center;flex-shrink:0;}
.date-pill .d{font-size:1.15rem;font-weight:700;line-height:1;color:var(--text-primary);}
.date-pill .m{font-size:.68rem;text-transform:uppercase;color:var(--text-secondary);}
.cal-main{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-surface);overflow:hidden;}
.cal-toolbar{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.cal-toolbar h2{font-size:1.2rem;margin-right:auto;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.month-grid .dow{background:var(--bg-surface-2);padding:10px;font-size:.7rem;font-weight:700;color:var(--text-secondary);text-align:center;border-bottom:1px solid var(--border);text-transform:uppercase;}
.month-cell{min-height:96px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;position:relative;}
.cal-main .month-cell{cursor:pointer;}
.month-cell:nth-child(7n){border-right:none;}
.month-cell .num{font-size:.8rem;color:var(--text-secondary);font-weight:600;}
.month-cell.other .num{opacity:.3;}
.month-cell.today{background:var(--accent-dim);}
.month-cell.today .num{color:var(--accent);}
.plan-chip{display:block;background:var(--accent);color:#000;font-size:.68rem;font-weight:700;padding:3px 6px;border-radius:5px;margin-top:4px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* DONUT */
.donut-wrap{display:flex;flex-direction:column;align-items:center;}
.donut{width:190px;height:190px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.donut-hole{width:112px;height:112px;background:var(--bg-surface);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut-hole .lbl{font-size:.7rem;color:var(--text-secondary);}
.donut-hole .val{font-size:1.6rem;font-weight:800;color:var(--text-primary);}
.legend-table{width:100%;margin-top:16px;font-size:.82rem;}
.legend-table td{padding:6px 4px;border-bottom:1px solid var(--border);color:var(--text-primary);}
.legend-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px;}

/* PLAN EDIT */
.plan-grid{display:grid;grid-template-columns:1fr 1fr 320px;gap:20px;align-items:start;}
@media(max-width:1200px){.plan-grid{grid-template-columns:1fr 1fr;}.plan-grid>.chartcard{grid-column:1/-1;}}
@media(max-width:760px){.plan-grid{grid-template-columns:1fr;}}
.skilltable input,.skilltable select{border:1px solid var(--border);border-radius:6px;padding:6px 8px;font-size:.82rem;width:100%;background:var(--bg-surface-2);color:var(--text-primary);}
.drag-handle{cursor:grab;color:var(--text-secondary);}
.tabbar{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto;}
.tabbar button{background:none;border:none;padding:10px 2px;font-size:.9rem;color:var(--text-secondary);border-bottom:2px solid transparent;font-weight:600;white-space:nowrap;}
.tabbar button.active{color:var(--accent);border-color:var(--accent);}
.settings-section{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);margin-bottom:22px;background:var(--bg-surface);}
.settings-section h4{background:var(--bg-surface-2);color:var(--text-secondary);margin:0;padding:12px 16px;font-size:.7rem;letter-spacing:.5px;text-transform:uppercase;font-weight:700;}
.settings-section .inner{padding:6px 16px;}
.color-swatch{width:34px;height:34px;border-radius:6px;border:1px solid var(--border);padding:0;overflow:hidden;background:none;}
.thumb{width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
.toast{position:fixed;bottom:calc(var(--nav-bottom-height) + 14px);left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:11px 20px;border-radius:8px;font-size:.85rem;font-weight:600;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.45);}
@media(min-width:768px){.toast{bottom:24px;}}
.stat-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px;}
.stat-box{flex:1;min-width:130px;border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 18px;background:var(--bg-surface);}
.stat-box .num{font-size:1.8rem;font-weight:800;color:var(--accent);}
.stat-box .lbl{font-size:.72rem;color:var(--text-secondary);margin-top:2px;text-transform:uppercase;letter-spacing:.4px;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg-primary);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.mutedtext{color:var(--text-secondary);font-size:.82rem;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-secondary);}
.empty-state-icon{font-size:2.2rem;margin-bottom:10px;opacity:.5;}

/* DIVE DRILLS SKILLS LIBRARY (read-only, from Supabase) */
.pp-divider{border-top:1px solid var(--border);margin:36px 0 24px;}
.dd-skills-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.dd-skills-header img{width:26px;height:26px;flex-shrink:0;}
.dd-skills-header h2{font-size:1.15rem;}
.dd-skills-header p{margin-top:2px;}
.skill-type-section{margin-bottom:22px;}
.skill-type-section h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin:0 0 10px;font-weight:700;}
.dd-skill-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.dd-skill-card .name{font-weight:700;color:var(--text-primary);}
.dd-skill-card .desc{color:var(--text-secondary);font-size:.82rem;margin-top:4px;}
.dd-skill-card .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar"></nav>
  <div id="mainWrap">
    <div id="debugBar"></div>
    <div class="pp-mobile-backbar"><a href="dashboard.html">← Dive Drills</a></div>
    <div id="statusBanner"></div>

<script>
/* ============================= ICONS (emoji, matching Dive Drills style) ============================= */
const ICONS = {
  home:'🏠', planner:'📋', skill:'🎯', calendar:'📅', settings:'⚙️',
  plus:'➕', chevDown:'▾', chevRight:'▸', menuL:'‹', menuR:'›', edit:'✏️', trash:'🗑️',
  search:'🔍', upload:'⬆️', download:'⬇️', image:'🖼️', note:'📝', printer:'🖨️',
  refresh:'🔄', x:'✕', location:'📍', megaphone:'📣', quote:'💬', flag:'🚩',
  folder:'📁', duplicate:'⧉', block:'📦', history:'🕒',
  wand:'✨', drag:'⠿',
};
function ic(name){return ICONS[name]||'';}

/* ============================= DATA LAYER ============================= */
const STORAGE_KEY='practicePlannerData_v3';
let seq=1000;
function uid(p){seq++;return (p||'id')+'_'+seq+'_'+Math.random().toString(36).slice(2,7);}
function todayISO(){const d=new Date();return d.toISOString().slice(0,10);}
function nowStamp(){return new Date().toISOString();}

// Club-wide default practice groups — seeded once (see loadDB()) and
// editable afterward from Settings -> Club Groups.
const DEFAULT_GROUPS = ['Learn to Dive','Novice','Lessons','Pre-Team','Sparks','Fire','Blaze','Masters','RIT'];

// Builds the club's flat, shared data set (skills, plans, etc. — no more
// per-team nesting). Only ever used to seed a brand-new, empty club.
function seedData(){
  const cats = [
    {id:uid('cat'),name:'1m Springboard',status:'Enabled'},
    {id:uid('cat'),name:'3m Springboard',status:'Enabled'},
    {id:uid('cat'),name:'1m Platform',status:'Enabled'},
    {id:uid('cat'),name:'3m Platform',status:'Enabled'},
    {id:uid('cat'),name:'Dryland',status:'Enabled'},
    {id:uid('cat'),name:'Trampoline',status:'Enabled'},
  ];
  const catByName = n => cats.find(c=>c.name===n).id;
  const skills = [
    {id:uid('skill'),name:'Front Jump Tuck',categoryId:catByName('1m Platform'),minutes:5,notes:'fast tuck',stations:false,status:'Enabled',dateCreated:nowStamp(),image:null},
    {id:uid('skill'),name:'Forward Approach & Hurdle',categoryId:catByName('1m Springboard'),minutes:10,notes:'focus on hurdle height',stations:false,status:'Enabled',dateCreated:nowStamp(),image:null},
    {id:uid('skill'),name:'Reverse Takeoff Balance',categoryId:catByName('3m Springboard'),minutes:8,notes:'chest up, arms locked',stations:true,status:'Enabled',dateCreated:nowStamp(),image:null},
    {id:uid('skill'),name:'Dry Board Bouncing',categoryId:catByName('Dryland'),minutes:15,notes:'3 sets of 10',stations:false,status:'Enabled',dateCreated:nowStamp(),image:null},
    {id:uid('skill'),name:'Trampoline Twist Progressions',categoryId:catByName('Trampoline'),minutes:12,notes:'spotter required',stations:true,status:'Enabled',dateCreated:nowStamp(),image:null},
    {id:uid('skill'),name:'Back Takeoff Balance Skill',categoryId:catByName('1m Platform'),minutes:6,notes:'',stations:false,status:'Enabled',dateCreated:nowStamp(),image:null},
  ];
  const locations=[{id:uid('loc'),name:'RIT Aquatics Center - Main Pool',dateCreated:nowStamp()}];
  const announcements=[{id:uid('ann'),text:'Bring your own towel this week — laundry machine is down.',dateCreated:nowStamp()}];
  const quotes=[{id:uid('quo'),text:'Work hard, have fun.',dateCreated:nowStamp()}];
  const practiceEmphasis=[{id:uid('pe'),text:'Clean entries — vertical line',dateCreated:nowStamp()}];
  const competitionEmphasis=[{id:uid('ce'),text:'Takeoff power & height',dateCreated:nowStamp()}];
  const notes=[{id:uid('note'),text:'Remember to log dryland reps for strength staff.',status:'Enabled',dateCreated:nowStamp()}];
  const groups=DEFAULT_GROUPS.map(name=>({id:uid('grp'),name,dateCreated:nowStamp()}));
  const plans=[{
    id:uid('plan'),name:'Practice 1',date:todayISO(),location:'',startTime:'12:00',ampm:'AM',duration:5,color:'#00c9a7',
    announcements:'Big 1st day',quote:'Work hard, have fun.',practiceEmphasis:'',competitionEmphasis:'',filterCategory:'',
    groups:[],visibility:'club',dateCreated:nowStamp(),
    rows:[{id:uid('row'),activity:'Front  Jump Tuck',min:5,category:'1m Platform',notes:'fast tuck',image:null,stations:false}]
  }];
  return {
    coach:{firstName:'Cliff',lastName:'Devries',username:'cwdatl@rit.edu',email:'cwdatl@rit.edu',timezone:'',isSuperUser:false},
    categories:cats,skills,skillBlocks:[],locations,announcements,quotes,practiceEmphasis,competitionEmphasis,notes,groups,plans,
    prefs:{defaultDuration:'',defaultStartTime:'',timeFormat:'12',skillEditPrompt:false,includeImages:true,includeVideos:false,includeColorsPrint:true},
    lastBackupAt:null,
  };
}
let DB;

// Cloud sync — see loadDB()/saveDB()/runSync() below for the full data
// layer. This block just loads local data as a last resort; the real
// entry point is the async loadDB(coachId) further down.
function loadLocalOnly(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      DB=JSON.parse(raw);
      migrateIfNeeded();
    } else {
      DB=seedData();
    }
  }catch(e){DB=seedData();}
}
function migrateIfNeeded(){
  // Guard against any hand-edited/imported files that are missing pieces.
  if(!DB.prefs)DB.prefs={defaultDuration:'',defaultStartTime:'',timeFormat:'12',skillEditPrompt:false,includeImages:true,includeVideos:false,includeColorsPrint:true};
  if(DB.lastBackupAt===undefined)DB.lastBackupAt=null;
  ['categories','skills','skillBlocks','locations','announcements','quotes','practiceEmphasis','competitionEmphasis','notes','groups','plans'].forEach(k=>{
    if(!DB[k])DB[k]=[];
  });
  if(!DB.coach)DB.coach={firstName:'',lastName:'',username:'',email:'',timezone:'',isSuperUser:false};
}
function saveDB(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(DB));
  scheduleSync();
}

/* =============================================
   CLOUD SYNC — Supabase-backed storage with localStorage as the
   offline/durable layer underneath it. Design:
     - saveDB() (called at every existing mutation call site, unchanged)
       still writes to localStorage synchronously, then debounces a
       call to runSync().
     - runSync() diffs the in-memory DB against the last SUCCESSFULLY
       synced snapshot (persisted in its own localStorage key so it
       survives reloads) and pushes only what actually changed, per
       entity type, per SYNC_CFG. This is what "intelligent partial
       saves" means here — one generic diff engine driven by a
       declarative config, not 15 hand-written save functions wired
       into every mutation call site individually.
     - Because the diff is always against the last confirmed-synced
       snapshot regardless of how long ago that was, reconnecting after
       being offline and re-running runSync() IS the queue replay — no
       separate offline queue data structure is needed.
   ============================================= */

const SYNC_SNAPSHOT_KEY = STORAGE_KEY+'_synced';

// One entry per club-wide shared DB array. `extraCols` is used to split
// the two emphasis lists (practice/competition) into one shared table
// via a `kind` discriminator column instead of two near-identical
// tables. `intCols` lists snake_case columns that are INTEGER in
// Postgres — the app sometimes stores these as '' (e.g. a blank
// plan-duration input), which Postgres rejects outright ("invalid input
// syntax for type integer"), so toSnakeRow() coerces every column named
// here.
const SYNC_CFG = [
  {key:'categories',         table:'dive_practice_categories'},
  {key:'skills',              table:'dive_practice_skills', intCols:['minutes']},
  {key:'skillBlocks',         table:'dive_practice_skill_blocks'},
  {key:'locations',           table:'dive_practice_locations'},
  {key:'announcements',       table:'dive_practice_announcements'},
  {key:'quotes',              table:'dive_practice_quotes'},
  {key:'practiceEmphasis',    table:'dive_practice_emphasis', extraCols:{kind:'practice'}},
  {key:'competitionEmphasis', table:'dive_practice_emphasis', extraCols:{kind:'competition'}},
  {key:'notes',               table:'dive_practice_notes'},
  {key:'groups',              table:'dive_practice_groups'},
  {key:'plans',                table:'dive_practice_plans', intCols:['duration']},
];

let SYNC_COACH_ID     = null;
let lastSyncedSnapshot = null;
let syncTimer = null, syncInFlight = false, syncQueued = false;
let isOffline = false;
let currentSyncStatus = 'idle';
let pendingMigrationLocalDB = null;

// Debug bar state (?debug=1) — see renderDebugBar() below.
let debugLoadSource      = 'loading…';
let debugRecordCounts    = null; // {categories:N, skills:N, ...} from the last Supabase fetch
let debugFetchError      = null; // the real error text when fetchAllFromSupabase() throws

function scheduleSync(){
  clearTimeout(syncTimer);
  syncTimer = setTimeout(runSync, 500);
}
// Best-effort: don't lose up to 500ms of pending cloud sync if the coach
// navigates away right after an edit. localStorage is already safe
// synchronously either way — this only affects how fast it reaches Supabase.
['visibilitychange','beforeunload'].forEach(evt=>{
  window.addEventListener(evt, ()=>{ if(document.visibilityState==='hidden'||evt==='beforeunload') runSync(); });
});

function syncStatusLabel(status){
  return status==='saving' ? 'Saving…' : status==='error' ? 'Sync error' : 'Synced';
}
function setSyncStatus(status){
  currentSyncStatus = status;
  const dot = document.getElementById('syncDot');
  const label = document.getElementById('syncLabel');
  if(dot) dot.className = 'sync-dot '+status;
  if(label) label.textContent = syncStatusLabel(status);
}

function camelToSnake(s){return s.replace(/([A-Z])/g,'_$1').toLowerCase();}
function snakeToCamel(s){return s.replace(/_([a-z0-9])/g,(_,c)=>c.toUpperCase());}

// '' / undefined / null / non-numeric -> null; otherwise a real integer.
// Postgres rejects '' outright for an INTEGER column ("invalid input
// syntax for type integer") — it does NOT treat it like NULL.
function toIntOrNull(v){
  if(v===''||v===undefined||v===null) return null;
  const n = parseInt(v,10);
  return Number.isNaN(n) ? null : n;
}

function toSnakeRow(record, cfg, coachId){
  const row = {coach_id:coachId};
  Object.keys(record).forEach(k=>{
    // coachId is always re-derived from the syncing coach (the coachId
    // param above), never trusted from the record — otherwise pushing a
    // record fetched as someone else's (e.g. a duplicated club plan)
    // would carry a stale foreign coach_id straight into the RLS check.
    if(k==='coachId') return;
    if(k==='dateCreated'){ row.created_at = record[k]; return; }
    row[camelToSnake(k)] = record[k];
  });
  if(cfg.intCols) cfg.intCols.forEach(col=>{ row[col] = toIntOrNull(row[col]); });
  if(cfg.extraCols) Object.assign(row, cfg.extraCols);
  return row;
}
function fromSnakeRow(row, cfg){
  const rec = {};
  Object.keys(row).forEach(k=>{
    if(k==='kind') return;
    if(k==='coach_id'){ rec.coachId = row[k]; return; }
    if(k==='created_at'){ rec.dateCreated = row[k]; return; }
    rec[snakeToCamel(k)] = row[k];
  });
  return rec;
}
function prefsToSnake(p){
  return {
    default_duration:p.defaultDuration||null, default_start_time:p.defaultStartTime||null,
    time_format:p.timeFormat||'12', skill_edit_prompt:!!p.skillEditPrompt,
    include_images:p.includeImages!==false, include_videos:!!p.includeVideos,
    include_colors_print:p.includeColorsPrint!==false,
  };
}
function prefsFromSnake(row){
  if(!row) return {defaultDuration:'',defaultStartTime:'',timeFormat:'12',skillEditPrompt:false,includeImages:true,includeVideos:false,includeColorsPrint:true};
  return {
    defaultDuration:row.default_duration||'', defaultStartTime:row.default_start_time||'',
    timeFormat:row.time_format||'12', skillEditPrompt:!!row.skill_edit_prompt,
    includeImages:row.include_images!==false, includeVideos:!!row.include_videos,
    includeColorsPrint:row.include_colors_print!==false,
  };
}

// Fetches the whole club's shared data (visible via RLS, not filtered
// by coach_id here — RLS decides what this coach can see) plus this
// coach's own private prefs row, and reconstructs the flat DB shape.
async function fetchAllFromSupabase(coachId){
  const sb = window.supabaseClient;
  const uniqueTables = [...new Set(SYNC_CFG.map(c=>c.table))];

  const [prefsRes, ...tableResList] = await Promise.all([
    sb.from('dive_practice_prefs').select('*').eq('coach_id', coachId).maybeSingle(),
    ...uniqueTables.map(table => sb.from(table).select('*')),
  ]);
  if(prefsRes.error) throw prefsRes.error;
  tableResList.forEach(r=>{ if(r.error) throw r.error; });

  const rowsByTable = {};
  uniqueTables.forEach((table,i)=>{ rowsByTable[table] = tableResList[i].data || []; });

  const data = {
    categories:[],skills:[],skillBlocks:[],locations:[],announcements:[],quotes:[],
    practiceEmphasis:[],competitionEmphasis:[],notes:[],groups:[],plans:[],
  };
  SYNC_CFG.forEach(cfg=>{
    (rowsByTable[cfg.table]||[]).forEach(row=>{
      if(cfg.extraCols && row.kind !== cfg.extraCols.kind) return; // emphasis: route by kind
      data[cfg.key].push(fromSnakeRow(row, cfg));
    });
  });

  return {
    coach:{firstName:'',lastName:'',username:'',email:'',timezone:'',isSuperUser:false}, // overwritten from Auth right after load, never synced
    ...data,
    prefs: prefsFromSnake(prefsRes.data),
    lastBackupAt: null,
  };
}

async function diffAndPush(cfg, current, prev, coachId){
  const sb = window.supabaseClient;
  const prevById = new Map(prev.map(r=>[r.id,r]));
  const curIds = new Set(current.map(r=>r.id));

  const toUpsert = current.filter(r=>{
    const p = prevById.get(r.id);
    return !p || JSON.stringify(r)!==JSON.stringify(p);
  });
  const toDelete = prev.filter(r=>!curIds.has(r.id)).map(r=>r.id);

  if(toUpsert.length){
    const rows = toUpsert.map(r=>toSnakeRow(r, cfg, coachId));
    const {error} = await sb.from(cfg.table).upsert(rows);
    if(error) throw error;
  }
  if(toDelete.length){
    const {error} = await sb.from(cfg.table).delete().in('id', toDelete);
    if(error) throw error;
  }
}

async function runSync(opts){
  const silent = !!(opts && opts.silent);
  clearTimeout(syncTimer);
  if(!lastSyncedSnapshot || !SYNC_COACH_ID) return false; // not initialized yet
  if(syncInFlight){ syncQueued = true; return false; }
  syncInFlight = true;
  setSyncStatus('saving');
  const sb = window.supabaseClient;
  const coachId = SYNC_COACH_ID;
  try{
    for(const cfg of SYNC_CFG){
      await diffAndPush(cfg, DB[cfg.key]||[], lastSyncedSnapshot[cfg.key]||[], coachId);
    }

    // Prefs — single row per coach, only written if it actually changed.
    const prefsPayload     = {coach_id:coachId, ...prefsToSnake(DB.prefs)};
    const prevPrefsPayload = lastSyncedSnapshot.prefs
      ? {coach_id:coachId, ...prefsToSnake(lastSyncedSnapshot.prefs)}
      : null;
    if(!prevPrefsPayload || JSON.stringify(prefsPayload)!==JSON.stringify(prevPrefsPayload)){
      const {error} = await sb.from('dive_practice_prefs').upsert(prefsPayload);
      if(error) throw error;
    }

    lastSyncedSnapshot = structuredClone(DB);
    localStorage.setItem(SYNC_SNAPSHOT_KEY, JSON.stringify(DB));
    isOffline = false;
    setSyncStatus('idle');
    renderOfflineBanner();
    return true;
  }catch(e){
    console.error('[practice] sync failed', e);
    isOffline = true;
    setSyncStatus('error');
    renderOfflineBanner();
    if(!silent) toast('Sync failed — changes are saved on this device and will retry.');
    return false;
  }finally{
    syncInFlight = false;
    if(syncQueued){ syncQueued = false; runSync(); }
  }
}

function persistLocalOnly(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(DB)); }

// Real entry point (called from the init IIFE). Priority order:
//   1. Check Supabase FIRST.
//   2. Cloud has data -> trust it, UNLESS *this device* has synced
//      successfully before and has genuine unsynced edits sitting on
//      top of its own last-known-synced state (offline queue replay —
//      see the hasSyncedBefore branch below). A device that has never
//      synced has no baseline to safely compare against, so its local
//      data is treated as stale once real cloud data exists elsewhere;
//      it does NOT get pushed or merged.
//   3. Cloud is empty for this coach -> fall back to localStorage.
//   4. localStorage has data -> one-time migration prompt.
//   5. Neither -> seed fresh sample data.
async function loadDB(coachId){
  console.log('loadDB: starting, will fetch from Supabase');
  SYNC_COACH_ID = coachId;
  const localRaw       = localStorage.getItem(STORAGE_KEY);
  const localSyncedRaw = localStorage.getItem(SYNC_SNAPSHOT_KEY);

  let remoteDB = null;
  try{
    remoteDB = await fetchAllFromSupabase(coachId);
    console.log('loadDB: Supabase returned', remoteDB);
    isOffline = false;
    debugRecordCounts = {};
    SYNC_CFG.forEach(cfg=>{ debugRecordCounts[cfg.key] = (remoteDB[cfg.key]||[]).length; });
  }catch(e){
    console.error('[practice] Supabase fetch failed, falling back to local', e);
    isOffline = true;
    debugFetchError = e?.message || String(e);
  }

  if(!remoteDB){
    if(localRaw){
      // Real fallback data to show — safe, we're not fabricating anything.
      loadLocalOnly();
      lastSyncedSnapshot = localSyncedRaw ? JSON.parse(localSyncedRaw) : {};
      persistLocalOnly();
      debugLoadSource = 'localStorage (fetch failed)';
    } else {
      // Couldn't reach Supabase AND this device has nothing cached.
      // Refuse to guess: surface a connection error instead of fabricating DB.
      debugLoadSource = 'error (fetch failed, no local fallback)';
      DB = null;
    }
    return;
  }

  // "Empty" now means nobody in the club has ever synced any data yet
  // (club-wide shared data, not per-coach) — a one-time event.
  const totalRecords = SYNC_CFG.reduce((sum,cfg)=>sum+(remoteDB[cfg.key]||[]).length, 0);
  const remoteEmpty     = totalRecords===0;
  const hasSyncedBefore = !!localSyncedRaw; // this device has completed at least one successful sync before

  if(!remoteEmpty){
    if(hasSyncedBefore){
      const syncedSnapshot   = JSON.parse(localSyncedRaw);
      const localMatchesSynced = localRaw && localRaw === JSON.stringify(syncedSnapshot);
      if(localRaw && !localMatchesSynced){
        // Genuine unsynced edits from THIS device's own prior sync
        // history (e.g. the tab was closed while offline). Keep them,
        // push them on the next sync.
        DB = JSON.parse(localRaw); migrateIfNeeded();
        lastSyncedSnapshot = syncedSnapshot;
        scheduleSync();
        debugLoadSource = 'localStorage (pending edits)';
        return;
      }
    }
    // Cloud has data and this device has no unresolved edits of its
    // own — trust the server. This is also how edits made by another
    // coach (or on another device) become visible here.
    DB = remoteDB;
    lastSyncedSnapshot = structuredClone(DB);
    localStorage.setItem(SYNC_SNAPSHOT_KEY, JSON.stringify(lastSyncedSnapshot));
    // Existing clubs that had data before this migration never went
    // through seedData()'s group-seeding — backfill the defaults once,
    // against the just-recorded snapshot, so it pushes as new inserts.
    if(!DB.groups.length){
      DB.groups = DEFAULT_GROUPS.map(name=>({id:uid('grp'),name,dateCreated:nowStamp()}));
      scheduleSync();
    }
    persistLocalOnly();
    debugLoadSource = 'supabase';
    return;
  }

  // Club is empty (nobody has ever synced).
  if(localRaw){
    pendingMigrationLocalDB = JSON.parse(localRaw);
    debugLoadSource = 'localStorage (awaiting migration choice)';
    return;
  }

  // Brand-new club, nothing local either — seed sample data and push
  // it up right away so every coach sees it.
  DB = seedData();
  lastSyncedSnapshot = {};
  persistLocalOnly();
  scheduleSync();
  debugLoadSource = 'seed';
}

/* ============================= ONE-TIME LOCAL -> CLOUD MIGRATION ============================= */
function offerLocalMigration(user){
  window.__migrationUser = user;
  openModal({
    title:'We found existing practice data on this device',
    bodyHtml:`<p>Would you like to import it to the cloud so you can access it from any device?</p>`,
    footHtml:`<button class="btn" onclick="startFresh()">Start Fresh</button>
              <button class="btn btn-primary" onclick="runLocalMigration()">Import to Cloud</button>`,
  });
}
// Explicit, deliberate "start fresh" action — used both by the one-time
// migration prompt's "Start Fresh" button and by the fetch-error screen's
// "Start Fresh Instead" escape hatch. Never called automatically; a coach
// always has to choose it, unlike loadDB()'s own seeding, which only ever
// fires when the cloud fetch itself succeeded and confirmed the club is empty.
function startFresh(){
  closeModal();
  // Defensive cleanup — don't let a stale sync snapshot linger and
  // confuse the next load.
  localStorage.removeItem(SYNC_SNAPSHOT_KEY);
  DB = seedData();
  lastSyncedSnapshot = {};
  pendingMigrationLocalDB = null;
  persistLocalOnly();
  scheduleSync();
  debugLoadSource = 'seed (started fresh)';
  finishInit(window.__migrationUser);
}
async function runLocalMigration(){
  closeModal();
  document.getElementById('content').innerHTML =
    '<div class="pp-loading-overlay"><div class="pp-loading-spinner pp-loading-spinner-lg"></div><span>Importing your data…</span></div>';
  DB = pendingMigrationLocalDB;
  migrateIfNeeded();
  lastSyncedSnapshot = {}; // empty baseline — every record reads as new
  const ok = await runSync({silent:true}); // runSync() catches its own errors, so check its return value, not a try/catch
  if(ok){
    localStorage.removeItem(STORAGE_KEY);
    toast('Practice data imported to the cloud');
  } else {
    toast('Import failed — your data is safe on this device, please try again.');
  }
  debugLoadSource = 'localStorage (migrated to cloud)';
  pendingMigrationLocalDB = null;
  finishInit(window.__migrationUser);
}

/* ============================= DEBUG BAR (?debug=1) ============================= */
// On-screen diagnostics for the load-source bug (iPhone Safari showing
// stale localStorage instead of Supabase data) — lets us see what
// happened without needing Safari's remote Web Inspector.
function isDebugMode(){
  return new URLSearchParams(location.search).get('debug') === '1';
}
function renderDebugBar(){
  const host = document.getElementById('debugBar');
  if(!host) return;
  if(!isDebugMode()){ host.innerHTML=''; return; }
  const hasLocal  = !!localStorage.getItem(STORAGE_KEY);
  const hasSynced = !!localStorage.getItem(SYNC_SNAPSHOT_KEY);
  const countsLine = debugRecordCounts
    ? Object.keys(debugRecordCounts).map(k=>`${esc(k)}: ${debugRecordCounts[k]}`).join(' &nbsp;|&nbsp; ')
    : 'n/a (fetch not yet run or failed)';
  host.innerHTML = `<div class="debug-bar">
    <div class="debug-bar-row">
      <span>Load source: <strong>${esc(debugLoadSource)}</strong></span>
      <span>Local storage has data: <strong>${hasLocal?'yes':'no'}</strong></span>
      <span>Sync snapshot exists: <strong>${hasSynced?'yes':'no'}</strong></span>
    </div>
    <div class="debug-bar-row">Cloud record counts: <strong>${countsLine}</strong></div>
    ${debugFetchError ? `<div class="debug-bar-row">Last fetch error: <strong>${esc(debugFetchError)}</strong></div>` : ''}
  </div>`;
}

/* ============================= OFFLINE BANNER ============================= */
function renderOfflineBanner(){
  const host=document.getElementById('statusBanner');
  if(!host)return;
  if(!isOffline){ host.innerHTML=''; return; }
  host.innerHTML=`<div class="status-alert">
    <span class="msg">📡 <strong>You're offline.</strong> Changes are being saved on this device and will sync automatically once you're back online.</span>
  </div>`;
}
function handleConnectivityChange(){
  if(navigator.onLine) scheduleSync();
  else { isOffline = true; renderOfflineBanner(); }
}

/* ============================= UTIL ============================= */
function esc(s){if(s===undefined||s===null)return'';return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// Bare YYYY-MM-DD strings parse as UTC midnight in JS, which rolls back
// a day in negative-UTC-offset zones (e.g. US Eastern) — only apply the
// local-midnight fix to bare date strings; full ISO timestamps (from
// nowStamp()) already have a time component and parse correctly as-is.
function fmtDate(iso){if(!iso)return'';const d=/^\d{4}-\d{2}-\d{2}$/.test(iso)?new Date(iso+'T00:00:00'):new Date(iso);if(isNaN(d))return iso;return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function fmtDateLong(iso){if(!iso)return'';const [y,m,d]=iso.split('-').map(Number);const dt=new Date(y,m-1,d);return dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
// Club-wide shared records (skills, locations, plans, etc.) are visible
// to every coach but only editable by whoever created them — this gates
// Edit/Delete UI everywhere those records are listed. RLS enforces the
// real restriction server-side; this just keeps the UI honest about it.
// A record with no coachId yet is one just created locally in this
// session that hasn't round-tripped through Supabase (which is where
// coachId gets populated, via fromSnakeRow) — always treat that as
// yours, never someone else's.
function isMine(rec){return rec.coachId===SYNC_COACH_ID||rec.coachId===undefined;}

/* ============================= MINUTES INPUT PAIR ============================= */
// A native number spinner plus an adjacent synced text input for the
// same value — coach can type directly into either or use the number
// input's up/down arrows. Reused wherever a "minutes" field appears.
function minutesInputPairHtml(idBase, value, onChangeAttr, disabled){
  const v = Math.max(1, Math.min(180, parseInt(value,10)||5));
  const change = onChangeAttr || '';
  const dis = disabled ? 'disabled' : '';
  return `<div class="min-input-pair">
    <input type="number" id="${idBase}_num" class="min-num input" value="${v}" min="1" max="180" data-prev="${v}" ${dis}
      oninput="syncMinutesInputs('${idBase}',this.value)" onblur="validateMinutesInput('${idBase}');${change}">
    <input type="text" inputmode="numeric" pattern="[0-9]*" id="${idBase}_txt" class="min-txt input" value="${v}" ${dis}
      oninput="syncMinutesInputs('${idBase}',this.value)" onblur="validateMinutesInput('${idBase}');${change}">
  </div>`;
}
function syncMinutesInputs(idBase, value){
  const num=document.getElementById(idBase+'_num'), txt=document.getElementById(idBase+'_txt');
  if(num) num.value=value;
  if(txt) txt.value=value;
}
// Only accepts a positive integer 1-180; anything else reverts to the
// last valid value (not clamped) — matches CLAUDE.md-flagged bug class
// of empty-string-into-numeric-field elsewhere in this app.
function validateMinutesInput(idBase){
  const num=document.getElementById(idBase+'_num');
  const n=Number(num.value);
  const prev=num.dataset.prev!==undefined?parseInt(num.dataset.prev,10):5;
  const valid=Number.isInteger(n)&&n>=1&&n<=180;
  const finalV=valid?n:prev;
  num.value=finalV;
  document.getElementById(idBase+'_txt').value=finalV;
  num.dataset.prev=finalV;
}
// High-contrast palette for the practice time allocation chart. Colors
// are assigned by CYCLING through this list in the order categories
// appear (see chartSliceColor below), not by hashing the category name
// — a hash can put two different categories in the same slot, which is
// what made slices hard to tell apart before. Only used by the
// allocation donut chart's slices/legend (renderPlanEdit's draw()).
const PALETTE=['#00c9a7','#f5a623','#e05252','#5b8dee','#a855f7','#10b981','#f59e0b','#ec4899'];
// Cycles through PALETTE by index; if wrapping around would repeat the
// immediately preceding slice's color, bumps to the next entry so two
// adjacent slices are never visually identical.
function chartSliceColor(i, prevColor){
  let c=PALETTE[i%PALETTE.length];
  if(c===prevColor) c=PALETTE[(i+1)%PALETTE.length];
  return c;
}
function to24(time,ampm){
  let [h,m]=time.split(':').map(Number);
  if(ampm==='AM'){if(h===12)h=0;}else{if(h!==12)h+=12;}
  return h*60+m;
}
function fromMinutes(total){
  total=((total%1440)+1440)%1440;
  let h=Math.floor(total/60),m=total%60;
  const ampm=h>=12?'PM':'AM';
  let h12=h%12;if(h12===0)h12=12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function escAttr(s){return esc(s).replace(/"/g,'&quot;');}
function getEnabledCategories(){return DB.categories.filter(c=>c.status!=='Disabled');}
function categoryName(id){const c=DB.categories.find(c=>c.id===id);return c?c.name:'';}

  renderSidebar();
}

function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function openModal({title,bodyHtml,footHtml,wide,onMount}){
  document.getElementById('modalRoot').innerHTML=`
    <div class="modal-overlay" onmousedown="if(event.target===this)closeModal()">
      <div class="modal ${wide?'wide':''}">
        <div class="modal-head"><h3>${title}</h3><button class="icon-btn" onclick="closeModal()">${ic('x')}</button></div>
        <div class="modal-body">${bodyHtml}</div>
        ${footHtml?`<div class="modal-foot">${footHtml}</div>`:''}
      </div>
    </div>`;
  if(onMount)onMount();
}
function confirmDelete(msg,cb){
  // Keep the real function reference (like window.__qaActions elsewhere
  // in this file) rather than cb.toString()-ing it into the onclick
  // attribute: re-parsing stringified source loses the closure over
  // whatever local variables (key, id, planId, ...) the caller closed
  // over, throwing "X is not defined" the moment the button is clicked.
  window.__confirmDeleteCb = cb;
  openModal({
    title:'Confirm delete',
    bodyHtml:`<p style="margin:0;">${esc(msg)}</p>`,
    footHtml:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="window.__confirmDeleteCb();closeModal();">Delete</button>`
  });
}

function renderSimpleList(cfg,container){
  container = container || document.getElementById('content');
  const list = DB[cfg.key];
  let search='';
  function draw(){
    const filtered = list.filter(item=>{
      if(!search)return true;
      const hay = cfg.fields.map(f=>item[f.key]||'').join(' ').toLowerCase();
      return hay.includes(search.toLowerCase());
    }).sort((a,b)=>(b.dateCreated||'').localeCompare(a.dateCreated||''));
    container.innerHTML = pageHeader(cfg.title, `<button class="btn btn-primary" onclick="openSimpleForm(CFG.${cfg.key})">${ic('plus')}${cfg.newLabel}</button>`) +
      `<div class="toolbar"><div class="search-wrap"><span class="s-icon">${ic('search')}</span><input class="input" placeholder="Search" id="sl-search"></div></div>
      <div class="tablewrap"><table><thead><tr>
        <th style="width:34px"><input type="checkbox" disabled></th>
        ${cfg.columns.map(c=>`<th>${c.label}</th>`).join('')}
        ${cfg.hasStatus?'<th>Status</th>':''}
        <th>Date Created</th><th style="text-align:right">Action</th>
      </tr></thead><tbody>
      ${filtered.length===0?`<tr class="empty-row"><td colspan="${cfg.columns.length+3+(cfg.hasStatus?1:0)}">${cfg.emptyText}</td></tr>`:
        filtered.map(item=>`<tr>
          <td><input type="checkbox"></td>
          ${cfg.columns.map(c=>`<td>${c.render(item)}</td>`).join('')}
          ${cfg.hasStatus?`<td><span class="badge ${item.status==='Disabled'?'badge-secondary':'badge-accent'}" style="cursor:pointer" onclick="toggleStatus('${cfg.key}','${item.id}')">${item.status||'Enabled'}</span></td>`:''}
          <td>${fmtDate(item.dateCreated)}</td>
          <td><div class="row-actions">
            ${isMine(item)?`<button class="icon-btn" onclick="openSimpleForm(CFG.${cfg.key},'${item.id}')" title="Edit">${ic('edit')}</button>
            <button class="icon-btn" onclick="deleteSimpleItem('${cfg.key}','${item.id}')" title="Delete">${ic('trash')}</button>`:''}
          </div></td>
        </tr>`).join('')}
      </tbody></table></div>`;
    document.getElementById('sl-search').value=search;
    document.getElementById('sl-search').oninput=(e)=>{search=e.target.value;draw();};
    document.getElementById('sl-search').focus();
    document.getElementById('sl-search').selectionStart=document.getElementById('sl-search').selectionEnd=search.length;
  }
  draw();
}
function toggleStatus(key,id){
  const item=DB[key].find(i=>i.id===id);
  item.status = item.status==='Disabled'?'Enabled':'Disabled';
  saveDB();router();
}
function deleteSimpleItem(key,id){
  confirmDelete('This will permanently delete this item. Continue?', ()=>{
    DB[key]=DB[key].filter(i=>i.id!==id);
    saveDB();router();
  });
}
function openSimpleForm(cfg,id){
  const item = id ? DB[cfg.key].find(i=>i.id===id) : {};
  const bodyHtml = cfg.fields.map(f=>`
    <div class="field"><label>${f.label}</label>
    ${f.type==='textarea'?`<textarea class="input" rows="3" id="f_${f.key}">${esc(item[f.key]||'')}</textarea>`
      :`<input class="input" id="f_${f.key}" placeholder="${f.placeholder||''}" value="${escAttr(item[f.key]||'')}">`}
    </div>`).join('');
  openModal({
    title:(id?'Edit ':'New ') + cfg.singular,
    bodyHtml,
    footHtml:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveSimpleForm('${cfg.key}','${id||''}')">Save</button>`
  });
}
function saveSimpleForm(key,id){
  const cfg=Object.values(CFG).find(c=>c.key===key);
  const data={};
  cfg.fields.forEach(f=>{data[f.key]=document.getElementById('f_'+f.key).value.trim();});
  if(id){
    Object.assign(DB[key].find(i=>i.id===id),data);
  } else {
    data.id=uid(key);data.dateCreated=nowStamp();if(cfg.hasStatus)data.status='Enabled';
    DB[key].push(data);
  }
  saveDB();closeModal();router();
  toast('Saved');
}

function buildMonthMatrix(year,month){
  const first=new Date(year,month,1);
  const startDow=first.getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const daysInPrev=new Date(year,month,0).getDate();
  const cells=[];
  for(let i=startDow-1;i>=0;i--)cells.push({day:daysInPrev-i,other:true,month:month-1});
  for(let d=1;d<=daysInMonth;d++)cells.push({day:d,other:false,month});
  while(cells.length%7!==0 || cells.length<42)cells.push({day:cells.length-startDow-daysInMonth+1,other:true,month:month+1});
  return cells;
}
function isoOf(year,month,day){
  const m=((month%12)+12)%12;
  const y=year+Math.floor(month/12)-(month<0?1:0);
  return `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}
function mountMiniMonthCalendar(host){
  let cur=new Date();
  function draw(){
    const y=cur.getFullYear(),m=cur.getMonth();
    const cells=buildMonthMatrix(y,m);
    const todayIso=todayISO();
    host.innerHTML=`
      <div class="mini-cal-toolbar">
        <button class="btn btn-sm">‹</button>
        <h2 style="font-size:1rem;">${cur.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2>
        <button class="btn btn-sm">›</button>
      </div>
      <div class="month-grid" style="border:1px solid var(--border);border-radius:8px;overflow:hidden;">
        ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}
        ${cells.map(c=>{
          const iso=isoOf(y,m,c.day);
          const plans=DB.plans.filter(p=>p.date===iso);
          return `<div class="month-cell ${c.other?'other':''} ${iso===todayIso?'today':''}">

          </div>`;
        }).join('')}
      </div>`;
    const btns=host.querySelectorAll('.mini-cal-toolbar button');
    btns[0].onclick=()=>{cur=new Date(y,m-1,1);draw();};
    btns[1].onclick=()=>{cur=new Date(y,m+1,1);draw();};
  }
  draw();
}

    const y=cur.getFullYear(),m=cur.getMonth();

  document.getElementById('calToday').onclick=()=>{cur=new Date();drawMain();};

}
// Clicking a date with at least one plan opens the first plan scheduled

function duplicatePlan(id){

function generateAIPlan(){
  const name=document.getElementById('ai_name').value.trim()||'New Plan';
  const date=document.getElementById('ai_date').value||todayISO();
  let minutes=parseInt(document.getElementById('ai_minutes').value)||60;
  const cat=document.getElementById('ai_cat').value;
  let pool=DB.skills.filter(d=>d.status!=='Disabled' && (!cat || categoryName(d.categoryId)===cat));
  if(pool.length===0)pool=DB.skills.filter(d=>d.status!=='Disabled');
  const rows=[];
  let remaining=minutes,i=0,guard=0;
  while(remaining>0 && pool.length && guard<200){
    const d=pool[i%pool.length];
    const m=Math.min(d.minutes||5,remaining);
    rows.push({id:uid('row'),activity:d.name,min:m,category:categoryName(d.categoryId),notes:d.notes||'',image:null,stations:d.stations});
    remaining-=m;i++;guard++;
  }
  const plan={id:uid('plan'),name,date,location:'',startTime:'3:00',ampm:'PM',duration:minutes,color:'#00c9a7',
    announcements:'',quote:'',practiceEmphasis:'',competitionEmphasis:'',filterCategory:cat,groups:[],visibility:'club',dateCreated:nowStamp(),rows};
  DB.plans.push(plan);saveDB();closeModal();
  navigate('plans/edit/'+plan.id);
  toast('AI plan generated — review and tweak as needed');
}

function computeRowTimes(plan){
  let start=to24(plan.startTime||'12:00',plan.ampm||'AM');
  let cursor=start;
  return plan.rows.map(r=>{
    const s=cursor;const e=cursor+(parseInt(r.min)||0);cursor=e;
    return {start:s,end:e};
  });
}

function to12input(t,ampm){
  if(!t)return'00:00';
  let [h,m]=t.split(':').map(Number);
  if(ampm==='PM' && h!==12)h+=12;
  if(ampm==='AM' && h===12)h=0;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function savePlanMeta(id){
  const plan=DB.plans.find(p=>p.id===id);if(!plan)return;
  plan.name=document.getElementById('p_name').value||plan.name;
  plan.date=document.getElementById('p_date').value||plan.date;
  plan.announcements=document.getElementById('p_ann').value;
  plan.quote=document.getElementById('p_quote').value;
  plan.practiceEmphasis=document.getElementById('p_practice_emph').value;
  plan.competitionEmphasis=document.getElementById('p_comp_emph').value;
  plan.filterCategory=document.getElementById('p_filtercat').value;
  plan.location=document.getElementById('p_loc').value;
  const timeVal=document.getElementById('p_start').value||'00:00';
  let [hh,mm]=timeVal.split(':').map(Number);
  const ampm=hh>=12?'PM':'AM';let h12=hh%12;if(h12===0)h12=12;
  plan.startTime=`${h12}:${String(mm).padStart(2,'0')}`;plan.ampm=ampm;
  plan.duration=document.getElementById('p_duration').value;
  plan.color=document.getElementById('p_color').value;
  saveDB();
}
function updatePlanRow(planId,rowId,field,value){
  const plan=DB.plans.find(p=>p.id===planId);
  const row=plan.rows.find(r=>r.id===rowId);
  row[field]= field==='min'? (parseInt(value)||0) : value;
  if(field==='activity' && !row.ddSkillId) autoSaveSkillFromRow(row);
  saveDB();
  window.__currentPlanDraw();
}
// A coach typing a custom activity name into a plan row (not a
// Dive-Drills-sourced row — those are read-only and excluded via
// row.ddSkillId) gets auto-saved into DB.skills so it's reusable from
// the Skill Directory in future plans. Matches by name (trimmed,
// case-insensitive) so re-typing the same activity across plans never
// creates a duplicate library entry.
function autoSaveSkillFromRow(row){
  const name=(row.activity||'').trim();
  if(!name)return;
  const exists=DB.skills.some(s=>s.name.trim().toLowerCase()===name.toLowerCase());

/* ============================= DIVE DRILLS SKILLS LIBRARY (read-only, Supabase) ============================= */
// Display order for skill-type sections — matches the Dive Drills Skills Library page.
const SKILL_SECTION_ORDER = [
  'Basics', 'Conditioning', 'Flexibility', 'Trampoline', 'Trampoline in Belt',
  'Dryboard', 'Dryboard in Belt', 'Dry Platform', '1m Platform', '1m Platform in Belt',
  '1m Springboard', '3m Springboard', 'Platform', 'Pool', 'Games', 'Bonus',
];
let DD_SKILLS=[];          // cached Dive Drills skills, fetched once from Supabase
let ddSkillsLoading=false;
let ddSkillsError=null;
let ddShowAllSkills=false; // false = Testing Skills only (default), true = include supplemental
let ddSkillSearch='';
let ddSkillLevelFilter='';
let currentOpenPlanId=null; // the plan currently being edited — target for "+ Add to Plan"

function loadDiveDrillsSkills(){
  if(ddSkillsLoading)return;
  ddSkillsLoading=true;ddSkillsError=null;
  Skills.getAll().then(data=>{
    DD_SKILLS=data;ddSkillsLoading=false;
    if(currentRoute().split('/')[0]==='skills')drawDDSkills();
  }).catch(err=>{
    ddSkillsError=err.message||'Failed to load skills.';ddSkillsLoading=false;
    if(currentRoute().split('/')[0]==='skills')drawDDSkills();
  });
}

function drawDDSkills(){
  const host=document.getElementById('ddSkillsBody');
  if(!host)return;
  if(ddSkillsLoading){
    host.innerHTML=`<div style="display:flex;justify-content:center;padding:30px;"><span class="loading-spinner-dd"></span></div>
      <style>.loading-spinner-dd{display:inline-block;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:dd-spin .8s linear infinite;}@keyframes dd-spin{to{transform:rotate(360deg);}}</style>`;
    return;
  }
  if(ddSkillsError){
    host.innerHTML=`<div class="empty-state"><p style="color:var(--danger)">Could not load Dive Drills skills — ${esc(ddSkillsError)}</p><button class="btn btn-sm" onclick="loadDiveDrillsSkills();drawDDSkills();">Retry</button></div>`;
    return;
  }
  let list=DD_SKILLS.filter(s=>ddShowAllSkills||s.isTestable);
  if(ddSkillLevelFilter!=='')list=list.filter(s=>String(s.level)===String(ddSkillLevelFilter));
  if(ddSkillSearch)list=list.filter(s=>s.name.toLowerCase().includes(ddSkillSearch.toLowerCase()));
  if(!list.length){host.innerHTML='<p class="mutedtext">No matching skills found.</p>';return;}
  const byType={};
  list.forEach(s=>{const t=s.type||'Other';(byType[t]=byType[t]||[]).push(s);});
  const typesPresent=Object.keys(byType);
  const orderedTypes=[...SKILL_SECTION_ORDER.filter(t=>typesPresent.includes(t)),...typesPresent.filter(t=>!SKILL_SECTION_ORDER.includes(t)).sort()];
  host.innerHTML=orderedTypes.map(type=>{
    const skillsInType=byType[type].slice().sort((a,b)=>App.compareSkillOrder(a,b));
    return `<div class="skill-type-section">
      <h4>${esc(type)} <span class="mutedtext">(${skillsInType.length})</span></h4>
      ${skillsInType.map(buildDDSkillCard).join('')}
    </div>`;
  }).join('');
}

function buildDDSkillCard(skill){
  return `
    <div class="dd-skill-card">
      <div style="flex:1;min-width:200px;">
        <div class="name">${esc(skill.name)}</div>
        ${skill.description?`<div class="desc">${esc(skill.description)}</div>`:''}
        <div class="badges">
          <span class="badge badge-level">L${skill.level ?? '?'}</span>
          <span class="badge badge-secondary">${esc(skill.type)}</span>
        </div>
      </div>
      <button class="btn btn-sm btn-primary" onclick="addDDSkillToPlan('${skill.id}')">${ic('plus')} Add to Plan</button>
    </div>
  `;
}

function addDDSkillToPlan(skillId){
  const plan=currentOpenPlanId?DB.plans.find(p=>p.id===currentOpenPlanId):null;
  if(!plan){toast('Open or create a practice plan first');return;}
  const skill=DD_SKILLS.find(s=>s.id===skillId);
  if(!skill)return;
  plan.rows.push({id:uid('row'),activity:skill.name,min:5,category:skill.type,notes:skill.description||'',image:null,stations:false,ddSkillId:skill.id,ddSkillLevel:skill.level});

    body.innerHTML=`<div class="card" style="max-width:640px;">
      <div class="field-row">
        <div class="field"><label>First Name *</label><input class="input" id="s_first" value="${escAttr(DB.coach.firstName)}"></div>
        <div class="field"><label>Last Name *</label><input class="input" id="s_last" value="${escAttr(DB.coach.lastName)}"></div>
      </div>
      <div class="field"><label>Username *</label><input class="input" id="s_username" value="${escAttr(DB.coach.username)}"></div>
      <div class="field"><label>Email</label><input class="input" value="${escAttr(DB.coach.email)}" disabled style="opacity:.6;"></div>
      <div class="field"><label>Timezone</label><input class="input" id="s_tz" value="${escAttr(DB.coach.timezone||'')}" placeholder="e.g. Eastern Time"></div>
      <button class="btn btn-primary" onclick="saveGeneralInfo()">Save changes</button>
    </div>`;
  } else if(t==='groups'){
    body.innerHTML=`<p class="mutedtext" style="margin-top:0;">Practice groups are shared club-wide — every coach sees the same list when tagging a plan. You can only delete groups you added yourself.</p>`;
    const listHost=document.createElement('div');
    body.appendChild(listHost);
    renderSimpleList(CFG.groups, listHost);
  } else if(t==='planner'){
    const p=DB.prefs;
    body.innerHTML=`<div class="settings-section">
      <h4>General</h4>
      <div class="inner">
        <div class="toggle-row"><span>Skill Edit / Save Prompt Pop Up</span><label class="toggle"><input type="checkbox" id="pref_prompt" ${p.skillEditPrompt?'checked':''}><span class="slider"></span></label></div>
      </div>
    </div>
    <div class="settings-section">
      <h4>Default Duration &amp; Start Time</h4>
      <div class="inner">
        <div class="field" style="padding-top:14px;"><label>Default Duration (mins)</label><input class="input" id="pref_duration" value="${escAttr(p.defaultDuration||'')}" placeholder="e.g. 90"></div>
        <div class="field"><label>Default Start Time</label><input class="input" id="pref_starttime" value="${escAttr(p.defaultStartTime||'')}" placeholder="e.g. 3:00 PM"></div>
        <div class="field"><label>Time Format in Printout</label>
          <select class="input" id="pref_timeformat">
            <option value="12" ${p.timeFormat==='12'?'selected':''}>12 Hours</option>
            <option value="24" ${p.timeFormat==='24'?'selected':''}>24 Hours</option>
          </select>
        </div>
      </div>
    </div>
    <div class="settings-section">
      <h4>Print Upload Options</h4>
      <div class="inner">
        <div class="toggle-row"><span>Include Images</span><label class="toggle"><input type="checkbox" id="pref_images" ${p.includeImages?'checked':''}><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Include Videos</span><label class="toggle"><input type="checkbox" id="pref_videos" ${p.includeVideos?'checked':''}><span class="slider"></span></label></div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="savePlannerPrefs()">Save changes</button>`;
  } else if(t==='printout'){
    body.innerHTML=`<div class="card" style="max-width:640px;">
      <p class="mutedtext" style="margin-top:0;">These settings control what your printed practice plans look like.</p>
      <div class="toggle-row"><span>Use each plan's calendar color on printed plans</span><label class="toggle"><input type="checkbox" id="pref_printcolor" ${DB.prefs.includeColorsPrint?'checked':''}><span class="slider"></span></label></div>
      <button class="btn btn-primary" style="margin-top:16px;" onclick="savePrintoutPrefs()">Save changes</button>
    </div>`;
  } else if(t==='data'){
    body.innerHTML=`<div class="card" style="max-width:640px;">
      <p class="mutedtext" style="margin-top:0;">Your practice data automatically syncs to the cloud, so you can access it from any device. Export a copy as a manual backup, or import a file to move data between accounts.</p>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="exportData()">${ic('download')} Export Data (.json)</button>
        <label class="btn" style="cursor:pointer;">${ic('upload')} Import Data<input type="file" accept="application/json" style="display:none" onchange="importData(event)"></label>
        <button class="btn btn-danger" onclick="resetAllData()">${ic('trash')} Reset All Data</button>
      </div>
      <p class="mutedtext" style="margin-top:14px;">Last exported: ${DB.lastBackupAt?fmtDate(DB.lastBackupAt):'never'}</p>
    </div>`;
  }
}
function saveGeneralInfo(){
  DB.coach.firstName=document.getElementById('s_first').value.trim()||DB.coach.firstName;
  DB.coach.lastName=document.getElementById('s_last').value.trim();
  DB.coach.username=document.getElementById('s_username').value.trim();
  DB.coach.timezone=document.getElementById('s_tz').value;
  saveDB();router();toast('Saved');
}
function savePlannerPrefs(){
  DB.prefs.skillEditPrompt=document.getElementById('pref_prompt').checked;
  DB.prefs.defaultDuration=document.getElementById('pref_duration').value;
  DB.prefs.defaultStartTime=document.getElementById('pref_starttime').value;
  DB.prefs.timeFormat=document.getElementById('pref_timeformat').value;
  DB.prefs.includeImages=document.getElementById('pref_images').checked;
  DB.prefs.includeVideos=document.getElementById('pref_videos').checked;
  saveDB();toast('Preferences saved');
}
function savePrintoutPrefs(){
  DB.prefs.includeColorsPrint=document.getElementById('pref_printcolor').checked;
  saveDB();toast('Preferences saved');
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='practice-planner-backup-'+todayISO()+'.json';a.click();
  URL.revokeObjectURL(url);
  DB.lastBackupAt=nowStamp();saveDB();
  toast('Exported');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      DB=data;migrateIfNeeded();saveDB();router();toast('Data imported and syncing to the cloud');
    }catch(err){toast('Could not read that file.');}
  };
  reader.readAsText(file);
}
function resetAllData(){
  confirmDelete('This will erase everything and restore the sample data. This cannot be undone. Continue?',()=>{
    DB=seedData();saveDB();navigate('dashboard');router();
  });
}

/* ============================= INIT ============================= */
(async function initPracticePlanner(){
  renderDebugBar(); // show "loading…" immediately, before the async fetch even starts
  initSupabase();
  const user = await Auth.init(true);
  if(!user)return; // Auth.init() already redirected to index.html

  if(user.role!=='coach'){
    window.location.href='dashboard.html';
    return;
  }

  await loadDB(user.id);
  renderDebugBar();

  if(!DB){
    // loadDB() refused to fabricate a fresh club — couldn't reach Supabase and
    // this device has no local cache to fall back to. Show the real
    // error (this is often NOT a connectivity problem — a Postgrest/RLS
    // error also lands here, since loadDB() can't tell the two apart)
    // and offer an explicit, deliberate way to seed fresh data instead
    // of silently guessing.
    window.__migrationUser = user; // consumed by startFresh()
    document.getElementById('content').innerHTML = `
      <div class="pp-loading-overlay">
        <span style="font-size:1.4rem">📡</span>
        <span>Couldn't load your practice data from the cloud${debugFetchError ? ': '+esc(debugFetchError) : '.'}</span>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary" onclick="location.reload()">Retry</button>
          <button class="btn" onclick="startFresh()">Start Fresh Instead</button>
        </div>
      </div>`;
    return;
  }

  if(pendingMigrationLocalDB){
    offerLocalMigration(user);
    return; // offerLocalMigration() -> runLocalMigration()/startFresh() -> finishInit()
  }

  finishInit(user);
})();

function finishInit(user){
  // Coach identity always comes from Dive Drills auth, not the planner's
  // own (locally-stored, and never synced to Supabase) coach settings.
  DB.coach.firstName = App.firstName(user) || DB.coach.firstName;
  DB.coach.lastName  = user.last_name || (user.full_name||'').trim().split(/\s+/).slice(1).join(' ');
  DB.coach.email     = user.email || DB.coach.email;
  DB.coach.username  = user.email || DB.coach.username;
  DB.coach.isSuperUser = !!user.is_super_user;
  saveDB();

  loadDiveDrillsSkills();
  renderOfflineBanner();
  renderDebugBar();

  if(!location.hash)location.hash='#/dashboard';
  router();
}
</script>

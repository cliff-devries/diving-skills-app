async function _capturePdfBlock(html, blockWidthPx){
  const container=document.createElement('div');
  container.style.cssText=`position:fixed;left:-99999px;top:0;width:${blockWidthPx}px;background:#ffffff`;
  container.innerHTML=html;
  document.body.appendChild(container);
  try{
    return await html2canvas(container,{scale:2,backgroundColor:'#ffffff',useCORS:true});
  }finally{
    document.body.removeChild(container);
  }
}
// Fallback for the rare block taller than one full page — slices it across
// as many pages as needed. Mirrors the Reports module's _placeCanvasSliced.
function _placePdfCanvasSliced(doc,canvas,x,startY,widthPt,pxPerPt,maxHeightPt,pageHeight,margin,footerReserve){
  let renderedPx=0, y=startY, availablePt=maxHeightPt;
  while(renderedPx<canvas.height){
    const availablePx=availablePt*pxPerPt;
    const sliceHeightPx=Math.min(availablePx,canvas.height-renderedPx);
    const pageCanvas=document.createElement('canvas');
    pageCanvas.width=canvas.width;
    pageCanvas.height=sliceHeightPx;
    const ctx=pageCanvas.getContext('2d');
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);
    ctx.drawImage(canvas,0,renderedPx,canvas.width,sliceHeightPx,0,0,canvas.width,sliceHeightPx);
    const sliceHeightPt=sliceHeightPx/pxPerPt;
    doc.addImage(pageCanvas.toDataURL('image/jpeg',0.92),'JPEG',x,y,widthPt,sliceHeightPt);
    renderedPx+=sliceHeightPx;
    if(renderedPx<canvas.height){
      doc.addPage();
      y=margin;
      availablePt=pageHeight-margin*2-footerReserve;
    } else {
      y+=sliceHeightPt;
    }
  }
  return y;
}
async function generatePracticePDF(id){
  const plan=findPlanById(id);
  if(!plan)return;
  const btn=document.getElementById('pdfPrintBtn');
  const btnOrigHtml=btn?btn.innerHTML:null;
  if(btn){btn.disabled=true;btn.textContent='Generating PDF…';}
  toast('Generating PDF…');
  try{
    const times=computeRowTimes(plan);
    const d=buildDonutData(plan);
    const coachName=`${DB.coach.firstName||''} ${DB.coach.lastName||''}`.trim()||'Coach';
    const groupName=plan.groups&&plan.groups[0]?plan.groups[0]:'';

    const { jsPDF }=window.jspdf;
    const doc=new jsPDF({unit:'pt',format:'letter'});
    const pageWidth=doc.internal.pageSize.getWidth();
    const pageHeight=doc.internal.pageSize.getHeight();
    const margin=54; // 0.75in
    const footerReserve=44;
    const blockGap=10;
    const contentWidth=pageWidth-margin*2;
    const blockWidthPx=900; // fixed "device" width — keeps scaling consistent across every block

    const blockHtmls=[
      pdfHeaderBlockHtml(plan,groupName),
      pdfMiddleSectionBlockHtml(plan,d),
      pdfSkillsBlockHtml(plan,times,d),
      pdfNotesBlockHtml(plan),
    ].filter(Boolean);

    let y=margin;
    let firstBlockOnPage=true;
    for(const html of blockHtmls){
      const canvas=await _capturePdfBlock(html,blockWidthPx);
      const pxPerPt=canvas.width/contentWidth;
      const blockHeightPt=canvas.height/pxPerPt;
      const pageContentHeightPt=pageHeight-margin*2-footerReserve;

      if(!firstBlockOnPage && y+blockHeightPt>pageHeight-margin-footerReserve){
        doc.addPage();
        y=margin;
        firstBlockOnPage=true;
      }

      if(blockHeightPt>pageContentHeightPt){
        y=_placePdfCanvasSliced(doc,canvas,margin,y,contentWidth,pxPerPt,pageContentHeightPt,pageHeight,margin,footerReserve);
      } else {
        doc.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',margin,y,contentWidth,blockHeightPt);
        y+=blockHeightPt;
      }
      y+=blockGap;
      firstBlockOnPage=false;
    }

    const totalPages=doc.internal.getNumberOfPages();
    for(let i=1;i<=totalPages;i++){
      doc.setPage(i);
      doc.setDrawColor(0,201,167);
      doc.setLineWidth(1);
      doc.line(margin,pageHeight-46,pageWidth-margin,pageHeight-46);
      doc.setFont('helvetica','normal');
      doc.setFontSize(9.5);
      doc.setTextColor(102,102,102);
      doc.text(`Created by ${coachName}`,margin,pageHeight-32);
      doc.text('Upstate Diving',pageWidth/2,pageHeight-32,{align:'center'});
      doc.text('© 2026 DivePractice v1.0',pageWidth-margin,pageHeight-32,{align:'right'});
      doc.text(`Page ${i} of ${totalPages}`,pageWidth/2,pageHeight-18,{align:'center'});
    }

    const datePart=plan.date||todayISO();
    const fileName=groupName
      ? `Practice-${groupName.replace(/[^a-z0-9]+/gi,'_')}-${datePart}.pdf`
      : `Practice-${datePart}.pdf`;
    doc.save(fileName);
  }catch(err){
    console.error('Practice PDF generation failed:',err);
    toast('Could not generate PDF — see console for details');
  }finally{
    if(btn){btn.disabled=false;btn.innerHTML=btnOrigHtml;}
  }
}

/* ============================= SKILL DIRECTORY ============================= */
// Unified list (stationsOnly===false): DB.skills (Custom) + DD_SKILLS
// (Dive Drills, already cached by loadDiveDrillsSkills() — reused as-is,
// no separate fetch here) merged into one alphabetical list. stationsOnly
// stays custom-only, since "stations" is a per-custom-skill flag with no
// Dive Drills equivalent.
// Split shell-vs-table on purpose: renderShell() (page load, and whenever
// DD_SKILLS finishes loading) rebuilds the sorted base list and the whole
// page including the search <input>. renderTable() (every keystroke) only
// touches #skillListBody's innerHTML — filtering the already-sorted base
// list with a plain includes(), no re-sort — so the search input itself
// is never destroyed/recreated and never loses focus while typing.
function renderSkillList(container, stationsOnly){
  let search='';
  let baseList=[];

  function buildBaseList(){
    if(stationsOnly){
      baseList=DB.skills.filter(d=>d.stations)
        .map(d=>({kind:'custom',id:d.id,name:d.name,station:categoryName(d.categoryId),mine:isMine(d)}))
        .sort((a,b)=>a.name.localeCompare(b.name));
    } else {
      const customMatches=DB.skills.map(d=>({kind:'custom',id:d.id,name:d.name,station:categoryName(d.categoryId),mine:isMine(d)}));
      const ddMatches=DD_SKILLS.map(s=>({kind:'dd',id:s.id,name:s.name,station:s.type,level:s.level}));
      baseList=[...customMatches,...ddMatches].sort((a,b)=>a.name.localeCompare(b.name));
    }
  }

  function rowsHtmlFor(list){
    if(stationsOnly){
      return list.length===0?`<tr class="empty-row"><td colspan="3">No skills found.</td></tr>`:
        list.map(d=>`<tr>
          <td>${d.mine?`<a onclick="openSkillForm('${d.id}')" style="font-weight:700;color:var(--accent);">${esc(d.name)}</a>`:`<span style="font-weight:700;">${esc(d.name)}</span>`}</td>
          <td>${esc(d.station||'')}</td>
          <td><div class="row-actions">
            ${d.mine?`<button class="icon-btn" onclick="openSkillForm('${d.id}')">${ic('edit')}</button><button class="icon-btn" onclick="deleteSkill('${d.id}')">${ic('trash')}</button>`:''}
          </div></td>
        </tr>`).join('');
    }
    return list.length===0?`<tr class="empty-row"><td colspan="5">No skills found.</td></tr>`:
      list.map(m=>{
        if(m.kind==='custom'){
          return `<tr>
            <td>${m.mine?`<a onclick="openSkillForm('${m.id}')" style="font-weight:700;color:var(--accent);">${esc(m.name)}</a>`:`<span style="font-weight:700;color:var(--accent);">${esc(m.name)}</span>`}</td>
            <td>${esc(m.station||'')}</td>
            <td></td>
            <td><span class="badge badge-gold">&#9733; Custom</span></td>
            <td><div class="row-actions">
              ${m.mine?`<button class="icon-btn" onclick="openSkillForm('${m.id}')">${ic('edit')}</button><button class="icon-btn" onclick="deleteSkill('${m.id}')">${ic('trash')}</button>`:''}
            </div></td>
          </tr>`;
        }
        return `<tr>
          <td style="font-weight:700;">${esc(m.name)}</td>
          <td>${esc(m.station||'')}</td>
          <td>${m.level!=null?`<span class="badge badge-level">L${esc(String(m.level))}</span>`:''}</td>
          <td><span class="badge badge-accent">DD</span></td>
          <td></td>
        </tr>`;
      }).join('');
  }

  function renderTable(){
    const tbody=document.getElementById('skillListBody');
    if(!tbody)return;
    const q=search.trim().toLowerCase();
    const filtered=q?baseList.filter(m=>m.name.toLowerCase().includes(q)):baseList;
    tbody.innerHTML=rowsHtmlFor(filtered);
  }

  function renderShell(){
    buildBaseList();
    const theadHtml=stationsOnly
      ?`<th>Name</th><th>Station</th><th style="text-align:right">Action</th>`
      :`<th>Name</th><th>Station</th><th>Level</th><th>Source</th><th style="text-align:right">Action</th>`;

    container.innerHTML = pageHeader(stationsOnly?'Stations Skill List':'Skill List', `
      <button class="btn btn-primary" onclick="openSkillForm()">${ic('plus')} New Skill</button>
    `) +
    (stationsOnly?'':`<div style="margin:-10px 0 16px;"><a onclick="navigate('skill-blocks')">${ic('block')} Skill Block List</a> &nbsp;·&nbsp; <a onclick="navigate('stations')">Stations Skill List</a></div>`) +
    `<div class="toolbar"><div class="search-wrap"><span class="s-icon">${ic('search')}</span><input class="input" id="dr-search" placeholder="Search by name" value="${escAttr(search)}"></div></div>
    <div class="tablewrap"><table><thead><tr>${theadHtml}</tr></thead><tbody id="skillListBody"></tbody></table></div>` +
    (stationsOnly?'':`
      <div class="pp-divider"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h2 style="font-size:1.05rem;margin:0;">Rotations</h2>
        <button class="btn btn-primary" onclick="openRotationForm()">${ic('plus')} Create Rotation</button>
      </div>
      <div class="tablewrap"><table><thead><tr><th>Name</th><th>Stations</th><th>Total Minutes</th><th style="text-align:right">Action</th></tr></thead><tbody>
      ${DB.rotationTemplates.length===0?`<tr class="empty-row"><td colspan="4">No rotations yet.</td></tr>`:
        DB.rotationTemplates.map(t=>{const mine=isMine(t);return `<tr>
          <td>${mine?`<a onclick="openRotationForm('${t.id}')">${esc(t.name)}</a>`:esc(t.name)}</td>
          <td>${t.stations.length}</td>
          <td>${t.stations.reduce((s,st)=>s+(parseInt(st.minutes)||0),0)}</td>
          <td><div class="row-actions">
            ${mine?`<button class="icon-btn" onclick="openRotationForm('${t.id}')">${ic('edit')}</button>
            <button class="icon-btn" onclick="deleteRotationTemplate('${t.id}')">${ic('trash')}</button>`:''}
          </div></td>
        </tr>`;}).join('')}
      </tbody></table></div>
    `);
    document.getElementById('dr-search').oninput=e=>{search=e.target.value;renderTable();};
    renderTable();
  }

  // loadDiveDrillsSkills() calls this once DD_SKILLS finishes loading —
  // rebuilds the base list (now including DD results) and re-renders only
  // the table, leaving the search input (and whatever's typed in it) alone.
  window.__skillListDraw=()=>{buildBaseList();renderTable();};
  renderShell();
}

/* ============================= ROTATIONS ============================= */
function openRotationForm(id){
  const t=id?DB.rotationTemplates.find(t=>t.id===id):null;
  window.__rotationDraft={name:t?t.name:'',stations:t?JSON.parse(JSON.stringify(t.stations)):[{name:'',skillId:'',minutes:5}]};
  window.__rotationSaveId=id||'';
  drawRotationForm();
}
function drawRotationForm(){
  const draft=window.__rotationDraft;
  openModal({
    title: window.__rotationSaveId?'Edit Rotation':'New Rotation',
    wide:true,
    bodyHtml:`
      <div class="field"><label>Rotation Name</label><input class="input" id="rot_name" value="${escAttr(draft.name)}"></div>
      <div class="field"><label>Stations</label></div>
      <div class="tablewrap"><table><thead><tr><th>Station Name</th><th>Skill (optional)</th><th style="width:110px">Minutes</th><th></th></tr></thead><tbody>
      ${draft.stations.map((st,i)=>`<tr>
        <td><input class="input" value="${escAttr(st.name||'')}" onchange="rotationUpdateStation(${i},'name',this.value)"></td>
        <td><select class="input" onchange="rotationUpdateStation(${i},'skillId',this.value)">
          <option value="">--</option>
          ${DB.skills.map(d=>`<option value="${d.id}" ${st.skillId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}
        </select></td>
        <td><input class="input" type="number" value="${st.minutes||5}" onchange="rotationUpdateStation(${i},'minutes',this.value)"></td>
        <td><button class="icon-btn" onclick="rotationRemoveStation(${i})">${ic('trash')}</button></td>
      </tr>`).join('')}
      </tbody></table></div>
      <button class="btn btn-sm" style="margin-top:8px;" onclick="rotationAddStation()">${ic('plus')} Add Station</button>
    `,
    footHtml:`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveRotationForm()">Save</button>`
  });
}
function rotationAddStation(){window.__rotationDraft.stations.push({name:'',skillId:'',minutes:5});drawRotationForm();}
function rotationRemoveStation(i){window.__rotationDraft.stations.splice(i,1);drawRotationForm();}
function rotationUpdateStation(i,field,value){
  window.__rotationDraft.stations[i][field]= field==='minutes'?(parseInt(value)||0):value;
}
function saveRotationForm(){
  const draft=window.__rotationDraft;
  draft.name=document.getElementById('rot_name').value.trim()||'Untitled Rotation';
  const id=window.__rotationSaveId;
  if(id){
    Object.assign(DB.rotationTemplates.find(t=>t.id===id),{name:draft.name,stations:draft.stations});
  } else {
    DB.rotationTemplates.push({id:uid('rotation'),name:draft.name,stations:draft.stations,dateCreated:nowStamp()});
  }
  saveDB();closeModal();router();toast('Rotation saved');
}
function deleteRotationTemplate(id){
  confirmDelete('This will permanently delete this rotation. Continue?',()=>{
    DB.rotationTemplates=DB.rotationTemplates.filter(t=>t.id!==id);saveDB();router();
  });
}

function openSkillForm(id){
  const d=id?DB.skills.find(d=>d.id===id):{};

  openModal({

      <div class="field"><label>Station</label><select class="input" id="d_cat"><option value="">--</option>${cats.map(c=>`<option value="${c.id}" ${d.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Notes</label><textarea class="input" id="d_notes" rows="2">${esc(d.notes||'')}</textarea></div>

// Minutes/status are no longer editable — new skills default to 5
// minutes/Enabled (coach adjusts minutes per-row in the plan itself);
// editing an existing skill leaves its stored minutes/status untouched
// rather than silently overwriting them from a form that no longer shows
// either field.
function saveSkillForm(id){
  const data={
    name:document.getElementById('d_name').value.trim()||'Untitled Skill',
    categoryId:document.getElementById('d_cat').value,
    notes:document.getElementById('d_notes').value,
    stations:document.getElementById('d_stations').checked,
  };
  if(id){Object.assign(DB.skills.find(d=>d.id===id),data);}
  else{data.id=uid('skill');data.dateCreated=nowStamp();data.image=null;data.minutes=5;data.status='Enabled';DB.skills.push(data);}
  saveDB();closeModal();router();toast('Skill saved');
}

/* ============================= DIVE DRILLS SKILLS (read-only, Supabase) ============================= */
let DD_SKILLS=[];          // cached Dive Drills skills, fetched once from Supabase — reused by both
                            // the unified Skill List and Practice Builder's inline search
let ddSkillsLoading=false;
let ddSkillsError=null;
let currentOpenPlanId=null; // the plan currently being edited — target for "+ Add to Plan"
// Set by the Skills page's "+ Add to Plan" when there's no active Builder
// draft to add straight into — Practice Builder picks this up and adds it
// the moment a draft becomes available (see renderPracticeBuilder()).
let pendingSkillToAdd=null; // {type:'dd', id} | null
function ddSkillToRow(skill){
  return {id:uid('row'),activity:skill.name,min:5,category:skill.type,notes:'',image:null,stations:false,ddSkillId:skill.id,ddSkillLevel:skill.level};
}

function loadDiveDrillsSkills(){
  if(ddSkillsLoading)return;
  ddSkillsLoading=true;ddSkillsError=null;
  Skills.getAll().then(data=>{
    DD_SKILLS=data;ddSkillsLoading=false;
    if(currentRoute().split('/')[0]==='skills' && window.__skillListDraw)window.__skillListDraw();
  }).catch(err=>{
    ddSkillsError=err.message||'Failed to load skills.';ddSkillsLoading=false;
    if(currentRoute().split('/')[0]==='skills' && window.__skillListDraw)window.__skillListDraw();
  });
}

// Called from both the Skills page's "+ Add to Plan" button and Practice
// Builder's own inline skill search (Dive Drills results). If a Builder
// draft is already active (even from a different page — see router()'s
// unsaved-draft handling), add straight to it and jump to the Builder. If
// not, queue it in pendingSkillToAdd and start a fresh draft — Practice
// Builder applies the queued skill as soon as that draft exists.
function addDDSkillToPlan(skillId){
  const skill=DD_SKILLS.find(s=>s.id===skillId);
  if(!skill)return;
  if(builderDraft){
    builderDraft.rows.push(ddSkillToRow(skill));
    builderDirty=true;
    if(window.__currentPlanDraw)window.__currentPlanDraw();
    toast('Skill added to Practice Builder');
    navigate(builderDraft.__sourceId?'builder/'+builderDraft.__sourceId:'builder');
  } else {
    pendingSkillToAdd={type:'dd',id:skill.id};
    toast('Skill added to Practice Builder');
    navigate('builder');
  }
}
function applyPendingSkillToAdd(){
  if(!pendingSkillToAdd || !builderDraft)return;
  const pending=pendingSkillToAdd;
  pendingSkillToAdd=null;
  if(pending.type==='dd'){
    const skill=DD_SKILLS.find(s=>s.id===pending.id);
    if(skill){ builderDraft.rows.push(ddSkillToRow(skill)); builderDirty=true; }
  }
}

    container.innerHTML=pageHeader('Skill Block List',`<button class="btn btn-primary" onclick="openSkillBlockForm()">${ic('plus')} New Skill Block</button>`)+
    `<div class="toolbar"><div class="search-wrap"><span class="s-icon">${ic('search')}</span><input class="input" id="db-search" placeholder="Search"></div></div>
    <div class="tablewrap"><table><thead><tr><th style="width:34px"><input type="checkbox" disabled></th><th>Skill Block Name</th><th>Total Skills</th><th>Date Created</th><th style="text-align:right">Action</th></tr></thead><tbody>
    ${list.length===0?`<tr class="empty-row"><td colspan="5">No skill blocks found.</td></tr>`:
      list.map(b=>{const mine=isMine(b);return `<tr><td><input type="checkbox"></td><td>${mine?`<a onclick="openSkillBlockForm('${b.id}')">${esc(b.name)}</a>`:esc(b.name)}</td><td>${b.skillIds.length}</td><td>${fmtDate(b.dateCreated)}</td>
      <td><div class="row-actions">${mine?`<button class="icon-btn" onclick="openSkillBlockForm('${b.id}')">${ic('edit')}</button><button class="icon-btn" onclick="deleteSkillBlock('${b.id}')">${ic('trash')}</button>`:''}</div></td></tr>`;}).join('')}
    </tbody></table></div>`;
    document.getElementById('db-search').value=search;
    document.getElementById('db-search').oninput=e=>{search=e.target.value;draw();};
  }
  draw();
}

function saveSkillBlockForm(id){
  const skillIds=[...document.querySelectorAll('.db_skill_chk:checked')].map(c=>c.value);

  else{DB.skillBlocks.push({id:uid('block'),name,skillIds,dateCreated:nowStamp()});}

}

function saveGeneralInfo(){
  DB.coach.firstName=document.getElementById('s_first').value.trim()||DB.coach.firstName;
  DB.coach.lastName=document.getElementById('s_last').value.trim();
  DB.coach.username=document.getElementById('s_username').value.trim();
  DB.coach.timezone=document.getElementById('s_tz').value;
  saveDB();router();toast('Saved');
}
function savePlannerPrefs(){
  DB.prefs.skillEditPrompt=document.getElementById('pref_prompt').checked;
  DB.prefs.defaultDuration=document.getElementById('pref_duration').value;
  DB.prefs.defaultStartTime=document.getElementById('pref_starttime').value;
  DB.prefs.timeFormat=document.getElementById('pref_timeformat').value;
  DB.prefs.includeImages=document.getElementById('pref_images').checked;
  DB.prefs.includeVideos=document.getElementById('pref_videos').checked;
  saveDB();toast('Preferences saved');
}
function savePrintoutPrefs(){
  DB.prefs.includeColorsPrint=document.getElementById('pref_printcolor').checked;
  saveDB();toast('Preferences saved');
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='practice-planner-backup-'+todayISO()+'.json';a.click();
  URL.revokeObjectURL(url);
  DB.lastBackupAt=nowStamp();saveDB();
  toast('Exported');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      DB=data;migrateIfNeeded();saveDB();router();toast('Data imported and syncing to the cloud');
    }catch(err){toast('Could not read that file.');}
  };
  reader.readAsText(file);
}
function resetAllData(){
  confirmDelete('This will erase everything and restore the sample data. This cannot be undone. Continue?',()=>{
    DB=seedData();saveDB();navigate('dashboard');router();
  });
}

/* ============================= INIT ============================= */
(async function initPracticePlanner(){
  renderDebugBar(); // show "loading…" immediately, before the async fetch even starts
  initSupabase();
  const user = await Auth.init(true);
  if(!user)return; // Auth.init() already redirected to index.html

  if(user.role!=='coach'){
    window.location.href='dashboard.html';
    return;
  }

  await loadDB(user.id);
  renderDebugBar();

  if(!DB){
    // loadDB() refused to fabricate a fresh club — couldn't reach Supabase and
    // this device has no local cache to fall back to. Show the real
    // error (this is often NOT a connectivity problem — a Postgrest/RLS
    // error also lands here, since loadDB() can't tell the two apart)
    // and offer an explicit, deliberate way to seed fresh data instead
    // of silently guessing.
    window.__migrationUser = user; // consumed by startFresh()
    document.getElementById('content').innerHTML = `
      <div class="pp-loading-overlay">
        <span style="font-size:1.4rem">📡</span>
        <span>Couldn't load your practice data from the cloud${debugFetchError ? ': '+esc(debugFetchError) : '.'}</span>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary" onclick="location.reload()">Retry</button>
          <button class="btn" onclick="startFresh()">Start Fresh Instead</button>
        </div>
      </div>`;
    return;
  }

  if(pendingMigrationLocalDB){
    offerLocalMigration(user);
    return; // offerLocalMigration() -> runLocalMigration()/startFresh() -> finishInit()
  }

  finishInit(user);
})();

function finishInit(user){
  // Coach identity always comes from Dive Drills auth, not the planner's
  // own (locally-stored, and never synced to Supabase) coach settings.
  DB.coach.firstName = App.firstName(user) || DB.coach.firstName;
  DB.coach.lastName  = user.last_name || (user.full_name||'').trim().split(/\s+/).slice(1).join(' ');
  DB.coach.email     = user.email || DB.coach.email;
  DB.coach.username  = user.email || DB.coach.username;
  DB.coach.isSuperUser = !!user.is_super_user;
  saveDB();

  loadDiveDrillsSkills();
  renderOfflineBanner();
  renderDebugBar();

  if(!location.hash)location.hash='#/dashboard';
  router();
}
</script>

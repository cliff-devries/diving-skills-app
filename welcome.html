<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dive Drills — Welcome</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="stylesheet" href="css/styles.css?v=10">
  <style>
    .welcome-card {
      max-width: 540px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    .welcome-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 20px 0;
    }
    .welcome-child-card {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      padding: 14px 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>

<div class="login-page">
  <div class="login-card fade-in welcome-card">

    <!-- Brand -->
    <div class="login-brand" style="margin-bottom:20px">
      <img src="assets/icons/diver-icon.svg" alt="Dive Drills" class="login-logo">
      <div class="login-app-name">Dive<span>Drills</span></div>
    </div>

    <div id="welcome-content">
      <div class="loading-overlay">
        <div class="loading-spinner loading-spinner-lg"></div>
        <span>Setting things up…</span>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js?v=33"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/app.js?v=9"></script>

<script>
  (async function initWelcomePage() {
    initSupabase();
    const user = await Auth.init(true);
    if (!user) return;

    if (user.role !== 'parent') {
      window.location.href = 'dashboard.html';
      return;
    }

    const firstName = (user.full_name || 'there').trim().split(/\s+/)[0];
    const content   = document.getElementById('welcome-content');
    await renderParentWelcome(content, firstName, user);
  })();

  async function renderParentWelcome(content, firstName, user) {
    const linked = await SupabaseDB.getLinkedDivers(user.id);

    if (!linked.length) {
      content.innerHTML = `
        <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:8px">Welcome, ${App.escHtml(firstName)}! 🎉</h1>
        <p class="text-secondary text-sm">
          Your Dive Drills family account is ready. You're not linked to a diver yet —
          ask your coach for an invite link.
        </p>
        <a href="dashboard.html" class="btn btn-ghost btn-full mt-3">Go to Dashboard</a>
      `;
      return;
    }

    const diver      = linked[0].diver;
    const diverNames = linked.map(l => l.diver.full_name).filter(Boolean).join(' and ');
    const levelLabel = diver.current_level != null ? App.getLevelLabel(diver.current_level) : 'Not set yet';

    content.innerHTML = `
      <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:8px">Welcome, ${App.escHtml(firstName)}! 🎉</h1>
      <p class="text-secondary text-sm">
        You and ${App.escHtml(diverNames)} now have access to Dive Drills. You can log in anytime to check
        progress, view test scores, and watch skill videos.
      </p>

      <div class="welcome-child-card">
        <div class="avatar avatar-md">${Auth.getInitials(diver.full_name)}</div>
        <div>
          <div style="font-weight:700">${App.escHtml(diver.full_name)}</div>
          <div class="text-sm text-secondary">${App.escHtml(String(levelLabel))}</div>
        </div>
      </div>

      <a href="progress.html?diver=${diver.id}" class="btn btn-primary btn-full btn-lg mb-3">View Progress</a>
      <a href="dashboard.html" class="btn btn-ghost btn-full">Go to Dashboard</a>
    `;
  }
</script>

</body>
</html>

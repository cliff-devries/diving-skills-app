<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DiveCentral — your complete diving platform from Upstate Diving.">
  <title>DiveCentral — Upstate Diving</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <script>
    // Supabase email links (confirm, magic link, reset) and old
    // ?status=pending_coach links still land on the root URL — hand them to
    // the sign-in page intact so it can finish the auth flow.
    (function () {
      var q = location.search, h = location.hash;
      if (/[?&](code|token_hash|status|error)=/.test(q) || /(access_token|refresh_token|error_description|type=)/.test(h)) {
        location.replace('/login.html' + q + h);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #0f0f0f;
      --text: #f5f5f5;
      --muted: #9a9a9a;
      --teal: #00c9a7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 70% 45% at 50% -10%, rgba(0, 201, 167, .14), transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    main {
      position: relative;
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 16px;
    }
    .wordmark {
      font-size: clamp(2.6rem, 9vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .wordmark .central { color: var(--teal); }
    .tagline {
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      font-weight: 500;
      margin-top: 14px;
    }
    .signin {
      display: inline-block;
      margin-top: 40px;
      min-width: 220px;
      padding: 15px 32px;
      border-radius: 12px;
      background: var(--teal);
      color: #0f0f0f;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      transition: filter .15s ease;
    }
    .signin:hover { filter: brightness(1.08); }
    .signin:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
      padding: 0 16px 28px;
    }
    @media (prefers-reduced-motion: reduce) {
      .signin { transition: none; }
    }
  </style>
</head>
<body>

<main>
  <h1 class="wordmark"><span>Dive</span><span class="central">Central</span></h1>
  <p class="tagline">Your complete diving platform</p>
  <a class="signin" href="login.html">Sign In</a>
</main>

<footer>&copy; 2026 Upstate Diving</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js?v=44"></script>
<script src="js/auth.js?v=6"></script>
<script>
  // Already signed in → skip the splash and go to the role's home page.
  (async function initSplash() {
    if (!window.supabase) return;
    initSupabase();
    const { data: { session } } = await window.supabaseClient.auth.getSession();
    if (!session) return;
    const profile = await SupabaseDB.getProfile(session.user.id);
    window.location.replace(profile ? Auth.homeUrl(profile) : '/login.html');
  })();
</script>

</body>
</html>

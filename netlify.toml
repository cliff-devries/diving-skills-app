# =============================================
# Netlify deployment configuration
# =============================================

[build]
  command   = "node scripts/generate-config.js"
  publish   = "."
  functions = "netlify/functions"

# js/config.js is generated at build time from the SUPABASE_URL and
# SUPABASE_ANON_KEY environment variables (see scripts/generate-config.js).
# The anon key is a PUBLIC key designed for client-side use
# (see: supabase.com/docs/guides/api/api-keys) — data is protected by RLS
# policies, not by keeping this key secret. We still omit it from the
# secrets scanner so the build doesn't get blocked.
[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "js/config.js"

# Security headers — applied to all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache static assets aggressively, HTML never
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirect bare domain → index.html (Netlify handles this automatically,
# but explicit rules here ensure it works for sub-paths too)
[[redirects]]
  from   = "/"
  to     = "/index.html"
  status = 200

# =============================================
# Public leaderboard subdomain — leaderboard.divedrills.com
# Serves the standalone, unauthenticated leaderboard-public.html at its
# own subdomain instead of a path under the main app domain.
#
# REQUIRED MANUAL SETUP (this redirect alone does nothing until both of
# these are done — a hostname-based redirect only fires for a domain
# Netlify already recognizes as belonging to this site):
#
#   1. DNS — in GoDaddy (or wherever divedrills.com is registered), add a
#      CNAME record:
#        Name:  leaderboard
#        Value: [this Netlify site's default domain, e.g. your-site-name.netlify.app]
#        TTL:   600
#
#   2. Netlify — Site settings → Domain management → Add domain alias:
#      leaderboard.divedrills.com
#      (Netlify won't provision/renew TLS for the subdomain, and this
#      redirect won't match, until the alias is added there.)
# =============================================
[[redirects]]
  from   = "https://leaderboard.divedrills.com/*"
  to     = "/leaderboard-public.html"
  status = 200
